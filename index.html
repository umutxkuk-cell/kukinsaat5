    <!-- GA4 event delegation: any element carrying data-ga-event (and optionally data-ga-category) -->
    <script>
      (function () {
        function send(name, params) {
          if (window.__kukAnalyticsAllowed === true && typeof window.gtag === 'function') window.gtag('event', name, params);
        }
        function labelOf(el) {
          return (el.getAttribute('data-ga-label') || el.getAttribute('aria-label') || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 100);
        }
        function linkType(href) {
          if (!href) return 'dugme';
          if (href.indexOf('tel:') === 0) return 'telefon';
          if (href.indexOf('mailto:') === 0) return 'eposta';
          if (href.charAt(0) === '#' || href.charAt(0) === '/') return 'sayfa_ici';
          return 'dis_baglanti';
        }
        document.addEventListener('click', function (event) {
          var target = event.target;
          var el = target && target.closest ? target.closest('[data-ga-event]') : null;
          if (!el || el.tagName === 'FORM') return;
          var href = el.getAttribute('href') || '';
          send(el.getAttribute('data-ga-event'), {
            event_category: el.getAttribute('data-ga-category') || 'etkilesim',
            event_label: labelOf(el),
            link_url: href || undefined,
            link_type: linkType(href),
            page_path: window.location.pathname + window.location.hash,
            transport_type: 'beacon'
          });
        }, true);
        document.addEventListener('submit', function (event) {
          var form = event.target;
          if (!form || !form.getAttribute) return;
          var name = form.getAttribute('data-ga-event');
          if (!name) return;
          send(name, {
            event_category: form.getAttribute('data-ga-category') || 'form',
            event_label: labelOf(form),
            page_path: window.location.pathname + window.location.hash,
            transport_type: 'beacon'
          });
        }, true);
      })();
